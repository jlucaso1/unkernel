# /etc/gtk-4.0/settings.ini (the kw layer): GTK 4 apps use their dark
# variant, as the page's desktop is dark. A user's own
# ~/.config/gtk-4.0/settings.ini comes after this and wins.

[Settings]
gtk-application-prefer-dark-theme=1
